name: Atualizar Dados do Deadlock

# 1. GATILHOS (Quando rodar?)
on:
  # Agendamento: Todo dia às 03:00 UTC (00:00 no horário de Brasília)
  schedule:
    - cron: "0 3 * * *"
  # Manual: Cria um botão "Run workflow" no site do GitHub para você testar quando quiser
  workflow_dispatch:

# 2. TAREFA (O que fazer?)
jobs:
  executar-etl:
    runs-on: ubuntu-latest # Liga uma máquina virtual Linux

    steps:
      # Passo 1: Clona os arquivos do seu repositório para dentro da máquina
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # Passo 2: Instala o Python 3.11
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Passo 3: Instala as bibliotecas do requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Passo 4: Roda o script injetando a URL do Neon guardada no cofre
      - name: Executar Pipeline ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python src/main.py
